name: Build installable packages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop-bundle:
    name: Build shared desktop bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout without orphaned reference submodules
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...
      - name: Configure public app settings
        run: cp .env.example .env
      - id: version
        name: Read package version
        run: echo "value=$(node -p 'require("./apps/desktop/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Build JavaScript bundle
        run: vp run build:desktop:bundle
      - name: Stage web asset manifest for packaged builds
        shell: bash
        run: |
          manifest=apps/server/dist/client/.vite/manifest.json
          if [[ -f "$manifest" ]]; then
            cp "$manifest" apps/server/dist/client/vite-manifest.release.json
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop-linux:
    name: Linux AppImage (x64)
    needs: [build-desktop-bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build-desktop-bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: dev
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: false
      relay_client_tracing: false

  desktop-windows:
    name: Windows installer (x64)
    needs: [build-desktop-bundle, desktop-linux]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build-desktop-bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: dev
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      label: Windows x64
      runner: ubuntu-24.04
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: false
      launch_check: false
      relay_client_tracing: false

  desktop-macos:
    name: macOS DMG (x64)
    needs: [build-desktop-bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build-desktop-bundle.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: dev
      clerk_publishable_key: pk_live_Y2xlcmsudDMuY29kZXMk
      clerk_jwt_template: t3-relay
      clerk_cli_oauth_client_id: hzxSgY2cH10sDU2r
      relay_url: https://relay.t3.codes
      label: macOS x64
      runner: macos-26-intel
      platform: mac
      target: dmg
      arch: x64
      rust_target: x86_64-apple-darwin
      resource_key: darwin-x64
      cli_archive: false
      launch_check: false
      relay_client_tracing: false

  mobile-android:
    name: Android APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      APP_VARIANT: production
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
    steps:
      - name: Checkout without orphaned reference submodules
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json
      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter=@t3tools/mobile...
      - name: Configure public app settings
        run: cp .env.example .env
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --clean --platform android
      - name: Build APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-android-apk-production-arm64
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
